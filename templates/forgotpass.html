<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
    <h1>Forgot Password</h1>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if success %}<p class="success show">{{ success }}</p>{% endif %}

    <form method="POST">
        <input type="email" name="email" placeholder="Enter registered email" required><br><br>
        <button class="transcribe-btn">Submit</button>
    </form>

    <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
</body>
</html>
