<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎤 Transcription Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()">☀ Light</button>

    <!-- Logout Button -->
<div class="logout-container">
    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
</div>

<div class="card">
    <h1>🎤 Transcribe Flow</h1>
    <p class="subtitle">AI Powered Transcription and Summary</p>

    <!-- Upload -->
    <div class="upload-container">
        <label class="upload-box">
            🎵 Upload Audio
            <input type="file" id="audioFile" accept=".mp3,.wav">
        </label>
    </div>

    <!-- Upload success -->
    <div class="success" id="successMsg">✅ Audio uploaded successfully</div>

    <!-- Transcribe Button -->
    <button class="transcribe-btn" onclick="uploadAudio()">🚀 Transcribe Audio</button>

    <!-- Processing -->
    <div class="processing" id="processing">
        <div class="spinner"></div>
        <p>Processing audio, please wait...</p>
    </div>

    <p class="error" id="error"></p>

    <!-- Audio Player -->
    <audio id="player" controls style="display:none;"></audio>

    <!-- Transcription Section -->
    <div class="section">
        <h2>📝 Transcription</h2>
        <div class="output-box transcript-box processed-text" id="transcript">
            Your transcription will appear here...
        </div>
        <!-- Download & Language -->
        <div class="download-buttons" id="transcriptBtns" style="display:none;">
            <button class="download-btn" onclick="downloadTxt('transcript')">TXT</button>
            <button class="download-btn" onclick="downloadPdf('transcript')">PDF</button>
            <select id="downloadLangTranscript" class="lang-select">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
            </select>
        </div>
    </div>

    <!-- Summary Section -->
    <div class="section">
        <h2>📌 Summary</h2>
        <div class="output-box summary-box processed-text" id="summary">
            Your summary will appear here...
        </div>
        <!-- Download & Language -->
        <div class="download-buttons" id="summaryBtns" style="display:none;">
            <button class="download-btn" onclick="downloadTxt('summary')">TXT</button>
            <button class="download-btn" onclick="downloadPdf('summary')">PDF</button>
            <select id="downloadLangSummary" class="lang-select">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
            </select>
        </div>
    </div>

</div>

<script>
const fileInput = document.getElementById("audioFile");
const successMsg = document.getElementById("successMsg");
const errorEl = document.getElementById("error");
const processing = document.getElementById("processing");
const transcriptEl = document.getElementById("transcript");
const summaryEl = document.getElementById("summary");
const player = document.getElementById("player");
const transcriptBtns = document.getElementById("transcriptBtns");
const summaryBtns = document.getElementById("summaryBtns");

// Show upload success message
fileInput.addEventListener("change", () => {
    errorEl.textContent = "";
    if(fileInput.files.length > 0){
        const file = fileInput.files[0];
        const ext = file.name.split('.').pop().toLowerCase();
        if(ext === "mp3" || ext === "wav"){
            successMsg.classList.add("show");
            setTimeout(() => { successMsg.classList.remove("show"); }, 3000);
        } else {
            successMsg.classList.remove("show");
            errorEl.textContent = "❌ Only MP3 or WAV files allowed";
        }
    }
});

// Transcribe audio
async function uploadAudio(){
    if(!fileInput.files.length){
        errorEl.textContent = "❌ Please select an audio file";
        return;
    }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext !== "mp3" && ext !== "wav"){
        errorEl.textContent = "❌ Only MP3 or WAV files allowed";
        return;
    }

    processing.style.display = "flex";
    transcriptEl.textContent = "";
    summaryEl.textContent = "";
    errorEl.textContent = "";
    transcriptBtns.style.display = "none";
    summaryBtns.style.display = "none";
    player.style.display = "none";

    const formData = new FormData();
    formData.append("audio", file);

    try{
        const response = await fetch("/", { method:"POST", body: formData });
        const data = await response.json();
        processing.style.display = "none";

        if(data.error){
            errorEl.textContent = data.error;
        } else {
            transcriptEl.textContent = data.transcript;
            summaryEl.textContent = data.summary;
            player.src = URL.createObjectURL(file);
            player.style.display = "block";
            transcriptBtns.style.display = "flex";
            summaryBtns.style.display = "flex";
        }
    } catch(err){
        processing.style.display = "none";
        errorEl.textContent = "❌ Server error. Try again later.";
    }
}

// Live translation
async function translateContent(type){
    const contentEl = type === "transcript" ? transcriptEl : summaryEl;
    const langSelect = document.getElementById(type === "transcript" ? "downloadLangTranscript" : "downloadLangSummary");
    const lang = langSelect.value;

    try{
        const res = await fetch("/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: contentEl.textContent, lang })
        });
        const data = await res.json();
        contentEl.textContent = data.translated;
    } catch(err){
        console.error(err);
    }
}

// Translate on language change
document.getElementById("downloadLangTranscript").addEventListener("change", ()=>translateContent("transcript"));
document.getElementById("downloadLangSummary").addEventListener("change", ()=>translateContent("summary"));

// Downloads
function downloadTxt(type){
    const content = type === "transcript" ? transcriptEl.textContent : summaryEl.textContent;
    const lang = type === "transcript" ? document.getElementById("downloadLangTranscript").value : document.getElementById("downloadLangSummary").value;
    window.location.href = `/download/txt?content=${encodeURIComponent(content)}&type=${type}&lang=${lang}`;
}
function downloadPdf(type){
    const content = type === "transcript" ? transcriptEl.textContent : summaryEl.textContent;
    const lang = type === "transcript" ? document.getElementById("downloadLangTranscript").value : document.getElementById("downloadLangSummary").value;
    window.location.href = `/download/pdf?content=${encodeURIComponent(content)}&type=${type}&lang=${lang}`;
}
</script>

<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
